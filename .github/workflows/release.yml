name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            target: ''
          - os: macos-latest
            bundles: dmg
            target: universal-apple-darwin
          - os: ubuntu-22.04
            bundles: deb,appimage
            target: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Linux system deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm install

      - name: Build & attach to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.2.6' }}
          releaseName: 'Z·POOL ${{ github.ref_name }}'
          releaseBody: |
            本版修复 / 改进

            - **修掉「查不到可领套餐、于是永远领不到」**：可领资格从 11-05 起不在
              <span class="mono">billing/preview</span> 里 —— 那个接口对所有号只回
              <span class="mono">{"code":0,"msg":""}</span>，连 <span class="mono">data</span> 都没有
              （官方客户端把这种应答当错误抛：<span class="mono">manual_claim_preview_missing_data</span>），
              而工具的「查可领套餐」把它读成「零个」，领取又要先在列表里找到 plan_id，于是手动、自动全都走不到那一发 POST。
              现在列表改从 <span class="mono">/api/v1/marketing/touch</span> 的投放里读：
              领取按钮是 <span class="mono">action.type = "claim_zcode_plan"</span>，套餐对象挂在
              <span class="mono">banner…args.zcode_plan</span>；只认带领取按钮的那一档（别的活动里塞的套餐不替用户点），
              而「应答缺 data」改成报错，不再替上游说「你没资格」。实测：那个一直领不到的号一键领上 300M。
            - **修掉「上游每一发都回 405、整池每 60 秒停摆」**：官方客户端 10-29 原地升级到
              3.17.1，两块 <span class="mono">system</span> 身份段整段换了文案（旧那句
              "You are an interactive ZCode agent" 在包里一处都不剩），而反代还在发上一代那两块 ——
              上游逐字节比，于是每发必回 <span class="mono">{"code":3012}</span>。
              提示词缓存的键原来只记 <span class="mono">zcode.cjs</span> 的**路径**，原地升级
              （路径不变、内容变了）永远冲不掉；现在按它的 mtime + 长度记，客户端一升级就重抽。
              校验也不再断言写死的旧字面量 —— 否则新文案反被当成「不合规」退回旧缓存。
              拿真凭证对照过：旧两块 405/3012，当前客户端的文案 200。
            - **405 里两种相反的病因不再混判**：业务服务自己回的 <span class="mono">{"code":3012}</span>
              现在定性成「出站提示词与上游要求不一致（换号、换出口都没用）」，只闸 15s；
              边缘 WAF 那页 HTML 仍按通道被拦熔 60s。以前只看状态码，于是提示词的毛病被报成
              「通道被拦」，还把人往查 WAF / 换出口上带。
            - **「立即放行」按钮真的能出现了**：网页读的是 <span class="mono">edgeLeft</span>，
              而那个字段从来没被接口吐过 —— 那个按钮永远渲染不出来，判错了只能干等冷却结束。
            - **冻结别再误伤**：传输层中断（本地协议栈掐线，与号无关）只凉 15s 且不计次；
              429 先看应答体里的业务码 —— <span class="mono">3009</span>（并发被占满，例：这个号正在
              官方客户端里用）只凉 15s 且不重取额度；不同号在 90s 内都回 429 判成**出口级限流**：
              闸整条通道 60s、一个号都不冻（限额不在号上，冻号没用）；冷却改成 30/60/120/240、
              封顶 5 分钟的阶梯，中间任何一发成功或手点解冻就清零；整池都在凉的时候转发自动
              **借道**最快解冻的那个号。状态列写清为什么被冻（「网络中断·14s」「并发占用·15s」
              「上游限流·30s」），不再只写「冷却」。
            - **对外接口「关了再也打不开」**：关掉那一发若还在途，监听 socket 不会立刻让开，
              紧接着 bind 必吃 <span class="mono">os error 10048</span>。现在 <span class="mono">stop()</span>
              一边等一边补踢（最多 1.5s），<span class="mono">start()</span> 带 4s 重试预算，
              报错也会点名是哪个端口。
            - **反代不再拿 provider 的 coding-plan apiKey 当上游凭证**：它排在候选第一位，
              而这条端点根本不认那种 key（实测三个带它的号一律 HTTP 401、空 body）。
              现在 apiKey 只垫底当兜底，打头的是 <span class="mono">zcodejwttoken</span>；
              对话测试会依次试这个号的候选（上限 4 份），谁真能用就**只记指纹**存进账号（不落明文），
              以后转发直接用它，添加账号 /「与当前登录同步」之后自动做一遍。
            - **对话测试不再拿「最后一次尝试」下结论**：以前只保留最后一发，会把 #1 拿到的 200
              覆盖成 #3 的 401，报出一个假的「凭证有问题」。现在每发的 status、业务码、应答片段
              单独留在结果里；只有 401/403 算凭证失效，200/402/429/5xx 都说明上游认这份凭证、
              只是这一刻出不了话，并把 <span class="mono">3009</span> / <span class="mono">3012</span>
              翻成人话。它**只报结果**：手点一下失败不会冷却这个号，也不会熔断整条通道。

            下载：Windows `*_x64-setup.exe` · macOS `*_universal.dmg` · Linux `*.deb` / `*.AppImage`

            程序未签名，首次运行系统可能提示来源未知。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target != '' && format('--target {0} ', matrix.target) || '' }}--bundles ${{ matrix.bundles }}
