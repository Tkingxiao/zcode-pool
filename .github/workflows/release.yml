name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            target: ''
          - os: macos-latest
            bundles: dmg
            target: universal-apple-darwin
          - os: ubuntu-22.04
            bundles: deb,appimage
            target: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Linux system deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm install

      - name: Build & attach to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.2.4' }}
          releaseName: 'Z·POOL ${{ github.ref_name }}'
          releaseBody: |
            本版修复 / 改进

            - **上游回 405 时不再疯狂重试**。旧版把边缘拦下的**整页 HTML 原样透传**给调用方，
              还逐个号再撞一遍（实测 3 分钟内累计 2870 发，越撞拦得越久）。现在**只有 2xx 才允许透传**，
              其余按「与号有没有关系」分档处置：
              - 401/402/403/429 = 这个号的问题 → 冷却该号、换下一个（原有行为不动）。
              - 404/405/406/410/411/413/414/415/451/501/505，以及任何拿回一页 HTML 的应答
                = **通道**被拦、与号无关 → **熔断 60 秒**，期间一个请求都不出站。
              - 5xx = 上游自己故障 → 熔断 15 秒。
              - 其余没见过的 4xx 多半是这一发请求本身不对 → 不重试，但**也不熔断**，
                免得一个客户端的坏请求把整池锁住。
              - **200 + HTML / 空 body** 同样判成被拦（判据只认「以 `<` 开头」和「首读即 EOF」，
                真流开头是 `event:` / `data:`，不会被误伤）。
              - 被按出口拦下时**换一个出口即可恢复**，与账号无关：同一发请求在别的出口就是正常应答。
            - **排障有线索了**：日志每次判罚记一行 `号｜HTTP 状态｜定性｜处置｜应答片段`，熔断期内只记第一条；
              额度 / 领取接口拿回非 JSON 时，不再显示成 `HTTP 405:` 后面一片空白。
            - **提示词去重**：调用方自己已经带官方身份段时，反代不再前置第二份 —— 上游按身份段在
              `system` 里的**出现次数**判篡改，多一份就回 405 `{"code":3012}`；多块 `system` 并成一块
              （上游硬上限 3 块）。
            - 新增 **`/v1/count_tokens` 本地估算**：上游没有这个接口，原样转发会拿回裸的
              `404 page not found`，客户端做上下文预算会整轮失败。中文按 1 字≈1 token 折算，
              不再按 4 字符把中文低估约 4 倍。
            - 提示词缓存改为**按抽取来源失效**：设置里换了 ZCode 安装路径就重新抽取，
              不再整个进程寿命内都用旧的那两块。

            下载：Windows `*_x64-setup.exe` · macOS `*_universal.dmg` · Linux `*.deb` / `*.AppImage`

            程序未签名，首次运行系统可能提示来源未知。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target != '' && format('--target {0} ', matrix.target) || '' }}--bundles ${{ matrix.bundles }}
