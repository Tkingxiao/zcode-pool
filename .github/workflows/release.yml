name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            target: ''
          - os: macos-latest
            bundles: dmg
            target: universal-apple-darwin
          - os: ubuntu-22.04
            bundles: deb,appimage
            target: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Linux system deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm install

      - name: Build & attach to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.2.5' }}
          releaseName: 'Z·POOL ${{ github.ref_name }}'
          releaseBody: |
            本版修复 / 改进

            - **修掉「号是活的却全线 401」**：`candidate_tokens` 把 ZCode 配置里 provider 的
              coding-plan apiKey 排在候选**第一位**，于是转发永远先拿它当 Bearer 发去
              `zcode-plan/anthropic` —— 而这条端点不认那种 key。实测三个带它的号一律
              HTTP 401（空 body），把凭证换成同一个号的 `zcodejwttoken` 立刻 200 出话。
              现在 apiKey 只垫底当兜底（有些号可能只有它），打头的是 JWT。
            - **凭证选错不再靠猜**：对话测试会依次试这个号的候选凭证（上限 4 份），
              谁真的能用就**只记指纹**存进账号（不落明文），以后转发直接用它；
              添加账号 /「与当前登录同步」之后会自动做一遍（跑在后台，不挡界面）。
              生产转发碰到 401 会把记下的指纹作废、退回默认顺序等下一次确认，
              凭证被重新登录换掉也不会抱着坏提示不放。
            - **渠道每行新增「对话测试」**：真给这个号发一发 <span class="mono">hi</span>
              （`max_tokens` 很小，几乎不花额度），行内直接给出结论 ——
              `收到回复 · 1.8s` / `无回复 HTTP 405 · 320ms` / `没拿到应答`，
              鼠标停上去能看到模型原话、被拦定性与应答片段。
              它**只报结果**：手点一下失败不会冷却这个号，也不会熔断整条通道。
            - 测试与真实转发**共用同一套出站路径**（请求头、代理、`system` 身份段改写
              都走同一个函数）。要是测试自己拼一个精简请求，少带一个头或少一块身份段，
              上游就回 405 `{"code":3012}` —— 那测出来的是拼包的毛病，不是号的毛病。
            - **对话测试不再把「上游忙」说成「凭证坏了」**：只有 401/403 算凭证失效，
              200/402/429/5xx 都说明上游认这份凭证、只是这一刻出不了话。标签分三档
              `收到回复` / `凭证可用 · 未出话` / `凭证被拒 HTTP 401`，并把上游业务码翻成人话
              （`3009` = 并发超限，例：这个号正在官方客户端里用；`3012` = 提示词被判异常）。
              每发候选凭证的 status、业务码、应答片段都单独留在结果里 —— 之前只保留最后一次，
              会把 #1 拿到的 200 覆盖成 #3 的 401，报出一个假的「凭证有问题」。
            - 「解冻」的文案讲清了它清的是**本地标记**：上游从没冻过任何号。
              那张 `号 → 解冻时刻` 表只在网关内存里（进程重启即清空），解冻只是让这个号
              立刻重新参与选号；真正的状态只有额度接口和上游应答能说明。

            下载：Windows `*_x64-setup.exe` · macOS `*_universal.dmg` · Linux `*.deb` / `*.AppImage`

            程序未签名，首次运行系统可能提示来源未知。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target != '' && format('--target {0} ', matrix.target) || '' }}--bundles ${{ matrix.bundles }}
